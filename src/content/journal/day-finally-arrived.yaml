title: The day finally arrived
date: 2026-07-30
location: Johannesburg, South Africa
author: Jaco
rank: 10
blocks:
  - type: prose
    text: |
      After all the planning, the day is finally here. Looking back, the whole process has actually been very cool — even with a few bumps along the way.

      First came the passports. We could not get the online bookings to cooperate, so Home Affairs in Maitland became the plan. On my first visit, they were only taking the first ten walk-ins and I arrived too late. The next time, I was there at six in the morning with my camp chair — first in line. Once they opened, it was surprisingly quick: about forty-five minutes and we were sorted. Three days later, our passports were ready.

      Then came the visas. The online forms were a bit of a mission and timed out once, which meant starting over, but the actual process was shockingly quick. Having our little boy with us helped too, and we were assisted very quickly.

      Today, Godwin took us to the airport at around 2pm. We arrived almost four hours before the flight, just to be safe, but everything has been wonderfully smooth — from check-in and bag drop to boarding gates and passport control.

      Right now, we are about to step onto the biggest aeroplane I have ever flown on: an Airbus A350. America, here we come.
